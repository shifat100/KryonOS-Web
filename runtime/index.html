<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KryonOS Web Simulator</title>
  <style>
    :root {
      --bg: #eef2f7;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --surface-soft: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #0ea5e9;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warn: #f59e0b;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(15, 23, 42, 0.04);
      --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.08), transparent 36%),
        radial-gradient(circle at 88% 100%, rgba(14, 165, 233, 0.08), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* Topbar */
    .topbar {
      min-height: 58px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: -0.25px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    .status-pill.ready {
      background: var(--success-bg);
      color: #15803d;
      border-color: #bbf7d0;
    }

    .status-pill.ready .status-dot {
      background: var(--success);
      animation: none;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
    }

    .status-pill.error {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .status-pill.error .status-dot {
      background: var(--danger);
      animation: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button, select {
      font-family: var(--sans);
      font-size: 13px;
      border-radius: 8px;
      outline: 0;
    }

    .select-input {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      max-width: 100%;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .select-input:hover, .select-input:focus {
      border-color: var(--primary);
    }

    .btn {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 60ms;
    }

    .btn svg {
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #94a3b8;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      border-color: #1d4ed8;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-color: #1e40af;
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--danger-bg);
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    /* Segmented Mobile Tabs */
    .mobile-tabs {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .mobile-tabs-inner {
      display: flex;
      width: 100%;
      background: var(--surface-soft);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .mobile-tab {
      flex: 1;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .mobile-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      padding: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .editor-card:focus-within {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08), var(--shadow);
    }

    .card-header {
      min-height: 44px;
      padding: 6px 14px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.1px;
    }

    .file-tab {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      padding: 3px 10px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--primary);
    }

    .hint-text {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kbd {
      font-family: var(--mono);
      font-size: 10.5px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text);
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      background: #fff;
    }

    .gutter {
      width: 48px;
      padding: 14px 10px 14px 0;
      background: var(--surface-alt);
      border-right: 1px solid var(--border);
      color: #94a3b8;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
      white-space: pre;
    }

    #codeEditor {
      flex: 1;
      min-width: 0;
      border: none;
      outline: 0;
      resize: none;
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      color: #0f172a;
      background: #fff;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .right-col {
      display: grid;
      grid-template-rows: 1.48fr 0.72fr;
      gap: 14px;
      min-height: 0;
    }

    .preset-group {
      display: inline-flex;
      background: var(--surface-soft);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 2px;
      flex-wrap: wrap;
    }

    .preset-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-btn:hover:not(.active) {
      color: var(--text);
    }

    .preset-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* Engineering Workbench + Sleek Hardware Bezel */
    .device-stage {
      flex: 1;
      min-height: 0;
      background-color: #f1f5f9;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      gap: 10px;
    }

    .device-bezel {
      background: linear-gradient(155deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 12px;
      box-shadow:
        0 18px 36px -12px rgba(15, 23, 42, 0.4),
        0 4px 10px rgba(15, 23, 42, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 100%;
      max-height: calc(100% - 30px);
      min-height: 0;
      min-width: 0;
    }

    .bezel-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .bezel-speaker {
      width: 34px;
      height: 4px;
      border-radius: 999px;
      background: #334155;
    }

    .bezel-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0ea5e9;
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.8);
    }

    #canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100% - 14px);
      border-radius: 7px;
      background: #000;
      outline: 0;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    #canvas:focus {
      box-shadow: 0 0 0 2px #3b82f6;
    }

    .device-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .touch-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--text);
      margin-left: auto;
      box-shadow: var(--shadow-sm);
    }

    .touch-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      transition: background 0.1s, box-shadow 0.1s;
    }

    .touch-badge.active {
      border-color: #93c5fd;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .touch-badge.active::before {
      background: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Dark Sleek Console Output */
    .console-card {
      background: #0b1120;
      border-color: #1e293b;
    }

    .console-card .card-header {
      background: #111827;
      border-bottom-color: #1e293b;
    }

    .console-card .card-title {
      color: #e2e8f0;
    }

    .console-card .btn-xs {
      background: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }

    .console-card .btn-xs:hover:not(:disabled) {
      background: #334155;
      color: #fff;
    }

    .console-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      background: #0b1120;
    }

    .log-line {
      padding: 3px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.12);
      word-break: break-word;
      color: #cbd5e1;
    }

    .log-line.err {
      color: #f87171;
      font-weight: 500;
    }

    .log-line.warn {
      color: #fbbf24;
    }

    .log-line.notify {
      color: #38bdf8;
    }

    .btn-xs {
      height: 27px;
      padding: 0 10px;
      font-size: 11.5px;
    }

    /* Detailed First-Time Tour Overlay */
    .tour-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: none;
      background: transparent;
    }

    .tour-backdrop.active {
      display: block;
    }

    .tour-spotlight {
      position: fixed;
      z-index: 9999;
      display: none;
      pointer-events: none;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.62), 0 0 0 3px #3b82f6, 0 0 24px rgba(59, 130, 246, 0.55);
      transition: top 0.28s cubic-bezier(0.22, 1, 0.36, 1), left 0.28s cubic-bezier(0.22, 1, 0.36, 1), width 0.28s cubic-bezier(0.22, 1, 0.36, 1), height 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tour-spotlight.active {
      display: block;
    }

    .tour-tooltip {
      position: fixed;
      z-index: 10000;
      display: none;
      width: 375px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 54px -8px rgba(15, 23, 42, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.7);
      color: var(--text);
      transition: top 0.28s cubic-bezier(0.22, 1, 0.36, 1), left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tour-tooltip.active {
      display: block;
    }

    .tour-progress-track {
      height: 4px;
      width: 100%;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .tour-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      width: 12.5%;
      transition: width 0.28s ease;
    }

    .tour-body {
      padding: 15px 16px 14px;
    }

    .tour-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tour-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.15px;
    }

    .tour-close {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .tour-close:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .tour-title {
      font-size: 15.5px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .tour-desc {
      font-size: 13px;
      line-height: 1.55;
      color: #475569;
      margin: 0 0 12px;
    }

    .tour-desc ul {
      margin: 8px 0 0;
      padding-left: 16px;
    }

    .tour-desc li {
      margin-bottom: 4px;
    }

    .tour-desc code {
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 5px;
      color: var(--primary);
      font-weight: 600;
    }

    .tour-tip {
      background: #f8fafc;
      border-left: 3px solid var(--accent);
      padding: 7px 10px;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: #334155;
      margin-bottom: 14px;
    }

    .tour-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .tour-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tour-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-strong);
      transition: all 0.2s ease;
    }

    .tour-dot.active {
      width: 16px;
      border-radius: 999px;
      background: var(--primary);
    }

    .tour-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Tablet & Android Phone Layout */
    @media (max-width: 900px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
        padding: 8px 12px;
        gap: 8px;
      }

      .brand {
        width: 100%;
      }

      .status-pill {
        margin-left: auto;
        max-width: 155px;
      }

      .toolbar-actions {
        width: 100%;
        gap: 6px;
      }

      .select-input {
        flex: 1 1 150px;
        height: 36px;
      }

      .btn {
        height: 36px;
        padding: 0 10px;
        font-size: 12.5px;
      }

      .mobile-tabs {
        display: flex;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      .editor-card,
      .right-col {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .workspace[data-mobile-tab="editor"] .editor-card {
        display: flex;
      }

      .workspace[data-mobile-tab="simulator"] .right-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .device-card {
        flex: 1.5 1 320px;
        min-height: 295px;
      }

      .console-card {
        flex: 1 1 165px;
        min-height: 155px;
      }
    }

    /* Compact Android Phone Adjustments */
    @media (max-width: 600px) {
      .brand-sub {
        display: none;
      }

      .hint-text {
        display: none;
      }

      .btn-group {
        flex: 1 1 auto;
      }

      .btn-group .btn {
        flex: 1;
      }

      #runBtn {
        flex: 1.35;
      }

      .gutter {
        width: 38px;
        font-size: 14px;
        padding: 12px 6px 12px 0;
      }

      #codeEditor {
        font-size: 14px;
        padding: 12px;
      }

      .device-stage {
        padding: 8px;
        gap: 6px;
      }

      .device-bezel {
        padding: 8px;
        border-radius: 12px;
        gap: 5px;
      }

      .preset-group {
        width: 100%;
      }

      .preset-btn {
        flex: 1;
        text-align: center;
        padding: 5px 4px;
        font-size: 11px;
      }

      .device-footer-hint {
        display: none;
      }

      .touch-badge {
        margin-left: 0;
        width: 100%;
        justify-content: center;
      }

      .tour-tooltip {
        width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" id="brandGroup">
        <div class="logo">K</div>
        <div class="brand-text">
          <span class="brand-title">KryonOS Web Simulator</span>
          <span class="brand-sub">Duktape 2.7 Powered</span>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Loading WASM...</span>
        </div>
      </div>

      <div class="toolbar-actions">
        <select class="select-input" id="sampleSelect" title="Load Sample App">
          <option value="hello">Sample: 3D Cube + Touch</option>
          <option value="paint">Sample: 2D Paint &amp; Sprites</option>
          <option value="fs_crypto">Sample: FS &amp; Crypto</option>
        </select>

        <input accept=".js" hidden id="fileInput" type="file">

        <div class="btn-group" id="fileGroup">
          <button class="btn" id="openBtn" title="Open local .js file" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Open</span>
          </button>
          <button class="btn" id="downloadBtn" title="Download current main.js" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Save</span>
          </button>
        </div>

        <div class="btn-group" id="runGroup">
          <button class="btn" id="reloadBtn" title="Restart current app" type="button" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span>Reload</span>
          </button>
          <button class="btn btn-danger" id="stopBtn" title="Stop running loop" type="button" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            <span>Stop</span>
          </button>
          <button class="btn btn-primary" id="runBtn" title="Ctrl + Enter" type="button" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            <span>Run</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="mobile-tabs" aria-label="Workspace View">
      <div class="mobile-tabs-inner">
        <button class="mobile-tab active" data-tab="simulator" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span>Simulator</span>
        </button>
        <button class="mobile-tab" data-tab="editor" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Code Editor</span>
        </button>
      </div>
    </nav>

    <main class="workspace" id="workspace" data-mobile-tab="simulator">
      <section class="card editor-card" id="editorCard">
        <div class="card-header">
          <div class="card-title">
            <span>Editor</span>
            <span class="file-tab">main.js</span>
          </div>
          <span class="hint-text">
            <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> Run
            &nbsp;•&nbsp;
            <span class="kbd">Tab</span> Indent
          </span>
        </div>
        <div class="editor-wrap">
          <div class="gutter" id="gutter">1</div>
          <textarea
            id="codeEditor"
            placeholder="// Write KryonOS JavaScript here..."
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
          ></textarea>
        </div>
      </section>

      <div class="right-col" id="rightCol">
        <section class="card device-card" id="deviceCard">
          <div class="card-header">
            <div class="card-title">Virtual Device</div>
            <div class="preset-group" id="presetGroup">
              <button class="preset-btn active" data-h="320" data-w="240" type="button">240×320 CYD</button>
              <button class="preset-btn" data-h="240" data-w="320" type="button">320×240 T-Deck</button>
              <button class="preset-btn" data-h="135" data-w="240" type="button">240×135 Cardputer</button>
            </div>
          </div>
          <div class="device-stage">
            <div class="device-bezel" id="deviceBezel">
              <div class="bezel-top">
                <span class="bezel-led"></span>
                <span class="bezel-speaker"></span>
              </div>
              <canvas height="440" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" width="560"></canvas>
            </div>
            <div class="device-footer">
              <span class="device-footer-hint">Mouse / Touch = Screen Input • Tap screen for Keyboard</span>
              <span class="touch-badge" id="touchBadge">Touch: UP (0, 0)</span>
            </div>
          </div>
        </section>

        <section class="card console-card" id="consoleCard">
          <div class="card-header">
            <div class="card-title">Console Output</div>
            <button class="btn btn-xs" id="clearConsoleBtn" type="button">Clear</button>
          </div>
          <div class="console-body" id="consoleOutput"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Detailed First-Time Onboarding Tour -->
  <div class="tour-backdrop" id="tourBackdrop" aria-hidden="true"></div>
  <div class="tour-spotlight" id="tourSpotlight" aria-hidden="true"></div>
  <div class="tour-tooltip" id="tourTooltip" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <div class="tour-progress-track">
      <div class="tour-progress-bar" id="tourProgressBar"></div>
    </div>
    <div class="tour-body">
      <div class="tour-head">
        <span class="tour-badge" id="tourStepBadge">Step 1 of 8</span>
        <button class="tour-close" id="tourCloseBtn" title="Close tour" type="button" aria-label="Close tour">&times;</button>
      </div>
      <h3 class="tour-title" id="tourTitle"></h3>
      <div class="tour-desc" id="tourDesc"></div>
      <div class="tour-tip" id="tourTip" hidden></div>
      <div class="tour-footer">
        <div class="tour-dots" id="tourDots"></div>
        <div class="tour-actions">
          <button class="btn btn-xs" id="tourSkipBtn" type="button">Skip</button>
          <button class="btn btn-xs" id="tourPrevBtn" type="button">Back</button>
          <button class="btn btn-xs btn-primary" id="tourNextBtn" type="button">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__kryonQueue = [];

    const editor = document.getElementById("codeEditor"),
      gutter = document.getElementById("gutter"),
      runBtn = document.getElementById("runBtn"),
      stopBtn = document.getElementById("stopBtn"),
      reloadBtn = document.getElementById("reloadBtn"),
      openBtn = document.getElementById("openBtn"),
      downloadBtn = document.getElementById("downloadBtn"),
      fileInput = document.getElementById("fileInput"),
      sampleSelect = document.getElementById("sampleSelect"),
      clearConsoleBtn = document.getElementById("clearConsoleBtn"),
      consoleOutput = document.getElementById("consoleOutput"),
      statusPill = document.getElementById("statusPill"),
      statusText = document.getElementById("statusText"),
      touchBadge = document.getElementById("touchBadge"),
      presetButtons = document.querySelectorAll(".preset-btn"),
      workspace = document.getElementById("workspace"),
      mobileTabs = document.querySelectorAll(".mobile-tab"),
      rightCol = document.getElementById("rightCol");

    const BUILTIN_SAMPLES = {
      hello: [
        "var angle = 0;",
        "",
        'FS.writeFile("/local/test.txt", "Hello KryonOS Web!");',
        'System.print("FS:", FS.readFile("/local/test.txt"));',
        'System.notify("Web Simulator Ready", "success", 2500);',
        "",
        "while (System.isRunning()) {",
        "    Kryon3D.begin();",
        "    Kryon3D.clear(0x000F);",
        "    Kryon3D.setCamera(0, 0, -4.5, 0, 0, 0, 60);",
        "    Kryon3D.drawCube(0, 0, 0, 1.5, angle * 0.7, angle, 0.2, Graphics.COLOR_CYAN);",
        "",
        "    System.setTextColor(Graphics.COLOR_WHITE);",
        '    System.drawString("KRYONOS WEB", 12, 12, 2);',
        "",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 7, Graphics.COLOR_YELLOW);",
        "    }",
        "",
        "    Kryon3D.end();",
        "    angle += 0.05;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      paint: [
        "System.fillScreen(0x1084);",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("TOUCH TO DRAW", 10, 10, 2);',
        "System.drawRoundRect(8, 34, System.width() - 16, System.height() - 44, 8, Graphics.COLOR_CYAN);",
        "",
        "var hueColors = [Graphics.COLOR_YELLOW, Graphics.COLOR_CYAN, Graphics.COLOR_GREEN, Graphics.COLOR_MAGENTA];",
        "var ci = 0;",
        "var tick = 0;",
        "",
        "while (System.isRunning()) {",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 5, hueColors[ci % hueColors.length]);",
        "        if (tick % 10 === 0) ci++;",
        "    }",
        "    tick++;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      fs_crypto: [
        "System.fillScreen(0x0000);",
        "System.setTextColor(Graphics.COLOR_GREEN);",
        'System.drawString("FS + CRYPTO TEST", 10, 14, 2);',
        "",
        'FS.mkdir("/local/notes");',
        'FS.writeFile("/local/notes/info.txt", "KryonOS WASM OK");',
        'var txt = FS.readFile("/local/notes/info.txt");',
        "var hash = Crypto.sha256(txt);",
        "",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("READ: " + txt, 10, 50, 1);',
        'System.drawString("SHA256:", 10, 72, 1);',
        "System.setTextColor(Graphics.COLOR_CYAN);",
        "System.drawString(hash.slice(0, 32), 10, 88, 1);",
        "System.drawString(hash.slice(32), 10, 102, 1);",
        "",
        'System.print("File:", txt);',
        'System.print("SHA256:", hash);',
        'System.print("FastMath.sin(PI/2):", FastMath.sin(FastMath.HALF_PI));',
        'System.notify("Hash computed!", "info", 2200);'
      ].join("\n")
    };

    function setMobileTab(tabName) {
      workspace.setAttribute("data-mobile-tab", tabName);
      mobileTabs.forEach(function(btn) {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tabName);
      });
      if (tabName === "editor") {
        updateGutter();
      }
    }

    mobileTabs.forEach(function(btn) {
      btn.addEventListener("click", function() {
        setMobileTab(btn.getAttribute("data-tab"));
      });
    });

    function updateGutter() {
      const e = editor.value.split("\n").length;
      let t = "";
      for (let n = 1; n <= e; n++) t += n + (n < e ? "\n" : "");
      gutter.textContent = t;
      gutter.scrollTop = editor.scrollTop;
    }

    function appendConsole(e, t) {
      const n = document.createElement("div");
      n.className = "log-line" + (t ? " " + t : "");
      if (!t) {
        if (e.indexOf("JS ERROR") !== -1 || e.indexOf("[ERR]") !== -1) n.classList.add("err");
        else if (e.indexOf("[WARN]") !== -1) n.classList.add("warn");
        else if (e.indexOf("[NOTIFY") !== -1) n.classList.add("notify");
      }
      n.textContent = e;
      consoleOutput.appendChild(n);
      while (consoleOutput.children.length > 200) {
        consoleOutput.removeChild(consoleOutput.firstChild);
      }
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function runCurrentCode() {
      if (runBtn.disabled) return;
      window.__kryonQueue.push({ type: "run", code: editor.value });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    }

    editor.addEventListener("input", updateGutter);
    editor.addEventListener("scroll", function() {
      gutter.scrollTop = editor.scrollTop;
    });
    editor.addEventListener("keydown", function(e) {
      if ("Tab" === e.key) {
        e.preventDefault();
        const t = editor.selectionStart,
          n = editor.selectionEnd;
        editor.value = editor.value.substring(0, t) + "  " + editor.value.substring(n);
        editor.selectionStart = editor.selectionEnd = t + 2;
        updateGutter();
      } else if ((e.ctrlKey || e.metaKey) && "Enter" === e.key) {
        e.preventDefault();
        runCurrentCode();
      }
    });

    window.onKryonLog = function(e) {
      appendConsole(e);
    };

    window.onKryonStatus = function(e) {
      statusText.textContent = e;
      statusPill.classList.remove("ready", "error");
      if (e.indexOf("JS ERROR") !== -1 || e.indexOf("Cannot open") !== -1) {
        statusPill.classList.add("error");
      } else {
        statusPill.classList.add("ready");
      }
    };

    window.onKryonTouch = function(e, t, n) {
      touchBadge.textContent = "Touch: " + (e ? "DOWN" : "UP") + " (" + t + ", " + n + ")";
      touchBadge.classList.toggle("active", Boolean(e));
    };

    runBtn.addEventListener("click", runCurrentCode);

    stopBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "stop" });
    });

    reloadBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "reload" });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    });

    clearConsoleBtn.addEventListener("click", function() {
      consoleOutput.innerHTML = "";
    });

    presetButtons.forEach(function(e) {
      e.addEventListener("click", function() {
        presetButtons.forEach(function(btn) {
          btn.classList.remove("active");
        });
        e.classList.add("active");
        const t = parseInt(e.getAttribute("data-w"), 10),
          n = parseInt(e.getAttribute("data-h"), 10);
        window.__kryonQueue.push({ type: "resize", w: t, h: n });
      });
    });

    sampleSelect.addEventListener("change", function() {
      const e = sampleSelect.value;
      if ("hello" === e && window.Module && Module.FS) {
        try {
          editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" });
          updateGutter();
          runCurrentCode();
          return;
        } catch (err) {}
      }
      editor.value = BUILTIN_SAMPLES[e] || BUILTIN_SAMPLES.hello;
      updateGutter();
      runCurrentCode();
    });

    openBtn.addEventListener("click", function() {
      fileInput.click();
    });

    fileInput.addEventListener("change", function() {
      const e = fileInput.files[0];
      if (!e) return;
      const t = new FileReader();
      t.onload = function() {
        editor.value = t.result;
        updateGutter();
        runCurrentCode();
      };
      t.readAsText(e);
      fileInput.value = "";
    });

    downloadBtn.addEventListener("click", function() {
      const e = new Blob([editor.value], { type: "text/javascript;charset=utf-8" }),
        t = document.createElement("a");
      t.href = URL.createObjectURL(e);
      t.download = "main.js";
      t.click();
      URL.revokeObjectURL(t.href);
    });

    /* --- Detailed First-Time Tour System (Auto-starts once, no toolbar button) --- */
    const TOUR_STORAGE_KEY = "kryonos_tour_done_v2";
    const tourBackdrop = document.getElementById("tourBackdrop"),
      tourSpotlight = document.getElementById("tourSpotlight"),
      tourTooltip = document.getElementById("tourTooltip"),
      tourProgressBar = document.getElementById("tourProgressBar"),
      tourStepBadge = document.getElementById("tourStepBadge"),
      tourTitle = document.getElementById("tourTitle"),
      tourDesc = document.getElementById("tourDesc"),
      tourTip = document.getElementById("tourTip"),
      tourDots = document.getElementById("tourDots"),
      tourSkipBtn = document.getElementById("tourSkipBtn"),
      tourPrevBtn = document.getElementById("tourPrevBtn"),
      tourNextBtn = document.getElementById("tourNextBtn"),
      tourCloseBtn = document.getElementById("tourCloseBtn");

    const TOUR_STEPS = [
      {
        target: "#brandGroup",
        tab: null,
        category: "Overview",
        title: "Welcome to KryonOS Web Simulator",
        desc: "This browser studio runs real <strong>KryonOS JavaScript</strong> apps using <code>Duktape 2.7</code> &amp; <code>SDL2 WebAssembly</code>—no ESP32 hardware required.<ul><li><strong>Amber dot:</strong> WASM engine is initializing</li><li><strong>Green dot:</strong> Ready to execute code</li><li><strong>Red dot:</strong> Runtime or script error detected</li></ul>",
        tip: "Everything executes locally in your browser memory and virtual filesystem."
      },
      {
        target: "#sampleSelect",
        tab: null,
        category: "Starter Apps",
        title: "Explore Built-in Sample Apps",
        desc: "Use this dropdown to load and immediately run curated demos:<ul><li><code>3D Cube + Touch</code> — Real-time 3D projection + touch circles</li><li><code>2D Paint &amp; Sprites</code> — Freehand canvas drawing via touch</li><li><code>FS &amp; Crypto</code> — Virtual file read/write, SHA-256 &amp; FastMath</li></ul>",
        tip: "Selecting any sample automatically updates main.js and runs it."
      },
      {
        target: "#fileGroup",
        tab: null,
        category: "File Management",
        title: "Open & Save Local Scripts",
        desc: "Work seamlessly with scripts stored on your phone or computer:<ul><li><strong>Open:</strong> Pick any <code>.js</code> file from your device storage and run it right away</li><li><strong>Save:</strong> Export your edited code as <code>main.js</code> anytime</li></ul>",
        tip: "Great for flashing or backing up apps you test in the simulator."
      },
      {
        target: "#editorCard",
        tab: "editor",
        category: "Code Editor",
        title: "Write & Edit KryonOS Apps (main.js)",
        desc: "Write ES5/Duktape JavaScript using built-in hardware modules:<ul><li><code>System</code> — Screen text, shapes, frame delay &amp; loop state</li><li><code>Kryon3D</code> — 3D camera, cubes &amp; scene rendering</li><li><code>Touch</code> &amp; <code>Graphics</code> — Live touch coordinates &amp; RGB565 colors</li><li><code>FS</code>, <code>Crypto</code> &amp; <code>FastMath</code> — Storage, SHA-256 &amp; math helpers</li></ul>",
        tip: "Shortcuts: Press Tab for 2-space indent and Ctrl+Enter to run on desktop."
      },
      {
        target: "#runGroup",
        tab: null,
        category: "Execution Controls",
        title: "Run, Stop & Reload Your App",
        desc: "Control the Duktape execution loop safely:<ul><li><strong>Run:</strong> Evaluates the current code in <code>main.js</code></li><li><strong>Stop:</strong> Breaks out of <code>while (System.isRunning())</code> loops</li><li><strong>Reload:</strong> Resets and restarts the active script cleanly</li></ul>",
        tip: "Always use System.isRunning() in game/animation loops so Stop works cleanly."
      },
      {
        target: "#presetGroup",
        tab: "simulator",
        category: "Hardware Targets",
        title: "Switch Device Screen Presets",
        desc: "Test responsive UI layouts across real ESP32 hardware form factors:<ul><li><code>240×320 CYD</code> — Portrait Cheap Yellow Display</li><li><code>320×240 T-Deck</code> — Landscape LilyGo T-Deck</li><li><code>240×135 Cardputer</code> — Compact M5Stack Cardputer</li></ul>",
        tip: "Use System.width() and System.height() in your code so apps adapt automatically."
      },
      {
        target: "#deviceBezel",
        tab: "simulator",
        category: "Virtual Screen",
        title: "Touch, Drag & Keyboard Input",
        desc: "Interact directly with the virtual display just like a physical touchscreen:<ul><li><strong>Touch / Mouse:</strong> Tap or drag to trigger <code>Touch.read()</code> events</li><li><strong>Keyboard:</strong> Tap the screen to focus it, then send arrow or text keys</li><li><strong>Touch Badge:</strong> Displays live <code>DOWN/UP (x, y)</code> state below</li></ul>",
        tip: "On Android, dragging inside the screen draws smoothly without scrolling the page."
      },
      {
        target: "#consoleCard",
        tab: "simulator",
        category: "Diagnostics",
        title: "Live Console & Error Output",
        desc: "Monitor everything your app outputs at runtime:<ul><li><code>System.print()</code> debug logs &amp; variable values</li><li><code>System.notify()</code> cyan notification logs</li><li>Amber warnings and red <code>JS ERROR</code> stack messages</li></ul>",
        tip: "Use the Clear button anytime to wipe old logs before your next test run."
      }
    ];

    let tourActive = false;
    let tourIndex = 0;

    function isTourDone() {
      try {
        return localStorage.getItem(TOUR_STORAGE_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function markTourDone() {
      try {
        localStorage.setItem(TOUR_STORAGE_KEY, "1");
      } catch (e) {}
    }

    function renderTourDots() {
      tourDots.innerHTML = "";
      for (let i = 0; i < TOUR_STEPS.length; i++) {
        const dot = document.createElement("span");
        dot.className = "tour-dot" + (i === tourIndex ? " active" : "");
        tourDots.appendChild(dot);
      }
    }

    function positionTourElements() {
      if (!tourActive) return;
      const step = TOUR_STEPS[tourIndex];
      const target = document.querySelector(step.target);
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const pad = 6;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const spTop = Math.max(4, rect.top - pad);
      const spLeft = Math.max(4, rect.left - pad);
      const spWidth = Math.min(vw - spLeft - 4, rect.width + pad * 2);
      const spHeight = Math.min(vh - spTop - 4, rect.height + pad * 2);

      tourSpotlight.style.top = spTop + "px";
      tourSpotlight.style.left = spLeft + "px";
      tourSpotlight.style.width = Math.max(28, spWidth) + "px";
      tourSpotlight.style.height = Math.max(28, spHeight) + "px";

      const tipRect = tourTooltip.getBoundingClientRect();
      const tipW = tipRect.width || Math.min(375, vw - 24);
      const tipH = tipRect.height || 230;
      const gap = 12;

      let tipLeft = rect.left + rect.width / 2 - tipW / 2;
      tipLeft = Math.max(12, Math.min(vw - tipW - 12, tipLeft));

      let tipTop;
      const spaceBelow = vh - (spTop + spHeight) - gap;
      const spaceAbove = spTop - gap;

      if (spaceBelow >= tipH + 12) {
        tipTop = spTop + spHeight + gap;
      } else if (spaceAbove >= tipH + 12) {
        tipTop = spTop - tipH - gap;
      } else {
        tipTop = spTop > vh * 0.4 ? 12 : Math.max(12, vh - tipH - 12);
      }

      tourTooltip.style.left = tipLeft + "px";
      tourTooltip.style.top = tipTop + "px";
    }

    function showTourStep(idx) {
      tourIndex = Math.max(0, Math.min(TOUR_STEPS.length - 1, idx));
      const step = TOUR_STEPS[tourIndex];

      if (window.innerWidth <= 900 && step.tab) {
        setMobileTab(step.tab);
      }

      tourProgressBar.style.width = (((tourIndex + 1) / TOUR_STEPS.length) * 100) + "%";
      tourStepBadge.textContent = "Step " + (tourIndex + 1) + " of " + TOUR_STEPS.length + " • " + step.category;
      tourTitle.textContent = step.title;
      tourDesc.innerHTML = step.desc;

      if (step.tip) {
        tourTip.textContent = "Tip: " + step.tip;
        tourTip.hidden = false;
      } else {
        tourTip.hidden = true;
      }

      tourPrevBtn.disabled = tourIndex === 0;
      tourNextBtn.textContent = tourIndex === TOUR_STEPS.length - 1 ? "Start Coding!" : "Next";
      renderTourDots();

      const target = document.querySelector(step.target);
      if (target && window.innerWidth <= 900) {
        target.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      requestAnimationFrame(function() {
        positionTourElements();
        setTimeout(positionTourElements, 240);
      });
    }

    function startTour() {
      tourActive = true;
      tourBackdrop.classList.add("active");
      tourSpotlight.classList.add("active");
      tourTooltip.classList.add("active");
      showTourStep(0);
    }

    function endTour() {
      tourActive = false;
      tourBackdrop.classList.remove("active");
      tourSpotlight.classList.remove("active");
      tourTooltip.classList.remove("active");
      markTourDone();
    }

    tourSkipBtn.addEventListener("click", endTour);
    tourCloseBtn.addEventListener("click", endTour);
    tourPrevBtn.addEventListener("click", function() {
      if (tourIndex > 0) showTourStep(tourIndex - 1);
    });
    tourNextBtn.addEventListener("click", function() {
      if (tourIndex < TOUR_STEPS.length - 1) showTourStep(tourIndex + 1);
      else endTour();
    });

    window.addEventListener("resize", positionTourElements);
    rightCol.addEventListener("scroll", positionTourElements);
    window.addEventListener("keydown", function(e) {
      if (!tourActive) return;
      if (e.key === "Escape") endTour();
      else if (e.key === "ArrowRight") {
        if (tourIndex < TOUR_STEPS.length - 1) showTourStep(tourIndex + 1);
        else endTour();
      } else if (e.key === "ArrowLeft" && tourIndex > 0) {
        showTourStep(tourIndex - 1);
      }
    });

    var Module = {
      canvas: document.getElementById("canvas"),
      printErr: function(e) {
        appendConsole(e, "err");
      },
      onRuntimeInitialized: function() {
        runBtn.disabled = false;
        stopBtn.disabled = false;
        reloadBtn.disabled = false;
        window.onKryonStatus("Ready");
        try {
          Module.FS
            ? (editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" }))
            : (editor.value = BUILTIN_SAMPLES.hello);
        } catch (e) {
          editor.value = BUILTIN_SAMPLES.hello;
        }
        updateGutter();
      }
    };

    editor.value = BUILTIN_SAMPLES.hello;
    updateGutter();

    if (!isTourDone()) {
      setTimeout(startTour, 450);
    }
  </script>
  <script async src="KryonOS-Simulator.js"></script>
</body>
</html>
