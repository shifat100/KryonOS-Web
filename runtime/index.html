<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KryonOS Web Simulator</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warn: #d97706;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 14px rgba(15, 23, 42, 0.04);
      --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .topbar {
      min-height: 54px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-text {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
    }

    .status-pill.ready .status-dot {
      background: var(--success);
    }

    .status-pill.error {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .status-pill.error .status-dot {
      background: var(--danger);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      font-family: var(--sans);
      font-size: 13px;
      border-radius: 7px;
      outline: 0;
    }

    .select-input {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      max-width: 100%;
    }

    .btn {
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 50ms;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #94a3b8;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--danger-bg);
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    .btn-ghost {
      color: var(--primary);
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .btn-ghost:hover:not(:disabled) {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    /* Mobile navigation tabs (hidden on desktop) */
    .mobile-tabs {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      gap: 8px;
      flex-shrink: 0;
    }

    .mobile-tab {
      flex: 1;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mobile-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      padding: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .card-header {
      min-height: 42px;
      padding: 6px 14px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--primary);
    }

    .hint-text {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      background: #fff;
    }

    .gutter {
      width: 46px;
      padding: 14px 8px 14px 0;
      background: var(--surface-alt);
      border-right: 1px solid var(--border);
      color: #94a3b8;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      text-align: right;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
      white-space: pre;
    }

    #codeEditor {
      flex: 1;
      min-width: 0;
      border: none;
      outline: 0;
      resize: none;
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      color: #0f172a;
      background: #fff;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .right-col {
      display: grid;
      grid-template-rows: 1.45fr 0.75fr;
      gap: 14px;
      min-height: 0;
    }

    .preset-group {
      display: inline-flex;
      background: var(--bg);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--border);
      gap: 2px;
      flex-wrap: wrap;
    }

    .preset-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .preset-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .device-stage {
      flex: 1;
      min-height: 0;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 8px;
    }

    .device-bezel {
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: calc(100% - 28px);
      min-height: 0;
      min-width: 0;
    }

    #canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      background: #000;
      outline: 0;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas:focus {
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    }

    .device-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .touch-badge {
      font-family: var(--mono);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 5px;
      color: var(--text);
      margin-left: auto;
    }

    .console-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      background: #fff;
    }

    .log-line {
      padding: 2px 0;
      border-bottom: 1px dashed #f1f5f9;
      word-break: break-word;
      color: #334155;
    }

    .log-line.err {
      color: var(--danger);
      font-weight: 500;
    }

    .log-line.warn {
      color: var(--warn);
    }

    .log-line.notify {
      color: var(--primary);
    }

    .btn-xs {
      height: 26px;
      padding: 0 10px;
      font-size: 11.5px;
    }

    /* First-Time Tour System */
    .tour-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: none;
      background: transparent;
    }

    .tour-backdrop.active {
      display: block;
    }

    .tour-spotlight {
      position: fixed;
      z-index: 9999;
      display: none;
      pointer-events: none;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.56), 0 0 0 3px #3b82f6;
      transition: top 0.24s ease, left 0.24s ease, width 0.24s ease, height 0.24s ease;
    }

    .tour-spotlight.active {
      display: block;
    }

    .tour-tooltip {
      position: fixed;
      z-index: 10000;
      display: none;
      width: 340px;
      max-width: calc(100vw - 24px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.24);
      color: var(--text);
      transition: top 0.24s ease, left 0.24s ease;
    }

    .tour-tooltip.active {
      display: block;
    }

    .tour-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tour-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.2px;
    }

    .tour-close {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .tour-close:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .tour-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--text);
    }

    .tour-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
      margin: 0 0 14px;
    }

    .tour-desc code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--primary);
    }

    .tour-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tour-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tour-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-strong);
      transition: background 0.2s, transform 0.2s;
    }

    .tour-dot.active {
      background: var(--primary);
      transform: scale(1.2);
    }

    .tour-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tablet & Android Phone Layout */
    @media (max-width: 900px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
        padding: 8px 12px;
        gap: 8px;
      }

      .brand {
        width: 100%;
      }

      .status-pill {
        margin-left: auto;
        max-width: 150px;
      }

      .toolbar-actions {
        width: 100%;
        gap: 6px;
      }

      .select-input {
        flex: 1 1 160px;
        height: 36px;
      }

      .btn {
        height: 36px;
        padding: 0 10px;
        font-size: 12.5px;
      }

      .mobile-tabs {
        display: flex;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      .editor-card,
      .right-col {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .workspace[data-mobile-tab="editor"] .editor-card {
        display: flex;
      }

      .workspace[data-mobile-tab="simulator"] .right-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .device-card {
        flex: 1.5 1 320px;
        min-height: 290px;
      }

      .console-card {
        flex: 1 1 160px;
        min-height: 150px;
      }
    }

    /* Compact Phone Adjustments */
    @media (max-width: 600px) {
      .brand-sub {
        display: none;
      }

      .hint-text {
        display: none;
      }

      .toolbar-actions .btn {
        flex: 1 1 auto;
      }

      #runBtn {
        flex: 1.4 1 auto;
      }

      .gutter {
        width: 38px;
        font-size: 14px;
        padding: 12px 6px 12px 0;
      }

      #codeEditor {
        font-size: 14px;
        padding: 12px;
      }

      .device-stage {
        padding: 8px;
        gap: 6px;
      }

      .device-bezel {
        padding: 6px;
        border-radius: 10px;
      }

      .preset-group {
        width: 100%;
      }

      .preset-btn {
        flex: 1;
        text-align: center;
        padding: 5px 4px;
        font-size: 11px;
      }

      .device-footer-hint {
        display: none;
      }

      .touch-badge {
        margin-left: 0;
        width: 100%;
        text-align: center;
      }

      .tour-tooltip {
        width: calc(100vw - 24px);
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">K</div>
        <div class="brand-text">
          <span class="brand-title">KryonOS Web Simulator</span>
          <span class="brand-sub">Duktape 2.7 + SDL2 WASM</span>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Loading WASM...</span>
        </div>
      </div>

      <div class="toolbar-actions">
        <select class="select-input" id="sampleSelect" title="Load Sample App">
          <option value="hello">Sample: 3D Cube + Touch</option>
          <option value="paint">Sample: 2D Paint &amp; Sprites</option>
          <option value="fs_crypto">Sample: FS &amp; Crypto</option>
        </select>
        <input accept=".js" hidden id="fileInput" type="file">
        <button class="btn" id="openBtn" title="Open local .js file" type="button">Open .js</button>
        <button class="btn" id="downloadBtn" title="Download current main.js" type="button">Save .js</button>
        <button class="btn" id="reloadBtn" title="Restart current app" type="button" disabled>Reload</button>
        <button class="btn btn-danger" id="stopBtn" title="Stop running loop" type="button" disabled>Stop</button>
        <button class="btn btn-primary" id="runBtn" title="Ctrl + Enter" type="button" disabled>▶ Run</button>
        <button class="btn btn-ghost" id="tourBtn" title="Start Interactive Tour" type="button">? Tour</button>
      </div>
    </header>

    <nav class="mobile-tabs" aria-label="Workspace View">
      <button class="mobile-tab active" data-tab="simulator" type="button">Simulator</button>
      <button class="mobile-tab" data-tab="editor" type="button">Code Editor</button>
    </nav>

    <main class="workspace" id="workspace" data-mobile-tab="simulator">
      <section class="card editor-card" id="editorCard">
        <div class="card-header">
          <div class="card-title">
            <span>Editor</span>
            <span class="file-tab">main.js</span>
          </div>
          <span class="hint-text">Ctrl+Enter: Run &nbsp;|&nbsp; Tab: Indent</span>
        </div>
        <div class="editor-wrap">
          <div class="gutter" id="gutter">1</div>
          <textarea
            id="codeEditor"
            placeholder="// Write KryonOS JavaScript here..."
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
          ></textarea>
        </div>
      </section>

      <div class="right-col" id="rightCol">
        <section class="card device-card" id="deviceCard">
          <div class="card-header">
            <div class="card-title">Virtual Device</div>
            <div class="preset-group">
              <button class="preset-btn active" data-h="320" data-w="240" type="button">240×320 CYD</button>
              <button class="preset-btn" data-h="240" data-w="320" type="button">320×240 T-Deck</button>
              <button class="preset-btn" data-h="135" data-w="240" type="button">240×135 Cardputer</button>
            </div>
          </div>
          <div class="device-stage">
            <div class="device-bezel">
              <canvas height="440" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" width="560"></canvas>
            </div>
            <div class="device-footer">
              <span class="device-footer-hint">Mouse = Touch • Click screen to send Keyboard / Arrow keys</span>
              <span class="touch-badge" id="touchBadge">Touch: UP (0, 0)</span>
            </div>
          </div>
        </section>

        <section class="card console-card" id="consoleCard">
          <div class="card-header">
            <div class="card-title">Console Output</div>
            <button class="btn btn-xs" id="clearConsoleBtn" type="button">Clear</button>
          </div>
          <div class="console-body" id="consoleOutput"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- First-Time Tour Overlay -->
  <div class="tour-backdrop" id="tourBackdrop" aria-hidden="true"></div>
  <div class="tour-spotlight" id="tourSpotlight" aria-hidden="true"></div>
  <div class="tour-tooltip" id="tourTooltip" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <div class="tour-head">
      <span class="tour-badge" id="tourStepBadge">Step 1 of 5</span>
      <button class="tour-close" id="tourCloseBtn" title="Close tour" type="button" aria-label="Close tour">&times;</button>
    </div>
    <h3 class="tour-title" id="tourTitle"></h3>
    <p class="tour-desc" id="tourDesc"></p>
    <div class="tour-footer">
      <div class="tour-dots" id="tourDots"></div>
      <div class="tour-actions">
        <button class="btn btn-xs" id="tourSkipBtn" type="button">Skip</button>
        <button class="btn btn-xs" id="tourPrevBtn" type="button">Back</button>
        <button class="btn btn-xs btn-primary" id="tourNextBtn" type="button">Next</button>
      </div>
    </div>
  </div>

  <script>
    window.__kryonQueue = [];

    const editor = document.getElementById("codeEditor"),
      gutter = document.getElementById("gutter"),
      runBtn = document.getElementById("runBtn"),
      stopBtn = document.getElementById("stopBtn"),
      reloadBtn = document.getElementById("reloadBtn"),
      openBtn = document.getElementById("openBtn"),
      downloadBtn = document.getElementById("downloadBtn"),
      fileInput = document.getElementById("fileInput"),
      sampleSelect = document.getElementById("sampleSelect"),
      clearConsoleBtn = document.getElementById("clearConsoleBtn"),
      consoleOutput = document.getElementById("consoleOutput"),
      statusPill = document.getElementById("statusPill"),
      statusText = document.getElementById("statusText"),
      touchBadge = document.getElementById("touchBadge"),
      presetButtons = document.querySelectorAll(".preset-btn"),
      workspace = document.getElementById("workspace"),
      mobileTabs = document.querySelectorAll(".mobile-tab"),
      rightCol = document.getElementById("rightCol"),
      tourBtn = document.getElementById("tourBtn");

    const BUILTIN_SAMPLES = {
      hello: [
        "var angle = 0;",
        "",
        'FS.writeFile("/local/test.txt", "Hello KryonOS Web!");',
        'System.print("FS:", FS.readFile("/local/test.txt"));',
        'System.notify("Web Simulator Ready", "success", 2500);',
        "",
        "while (System.isRunning()) {",
        "    Kryon3D.begin();",
        "    Kryon3D.clear(0x000F);",
        "    Kryon3D.setCamera(0, 0, -4.5, 0, 0, 0, 60);",
        "    Kryon3D.drawCube(0, 0, 0, 1.5, angle * 0.7, angle, 0.2, Graphics.COLOR_CYAN);",
        "",
        "    System.setTextColor(Graphics.COLOR_WHITE);",
        '    System.drawString("KRYONOS WEB", 12, 12, 2);',
        "",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 7, Graphics.COLOR_YELLOW);",
        "    }",
        "",
        "    Kryon3D.end();",
        "    angle += 0.05;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      paint: [
        "System.fillScreen(0x1084);",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("TOUCH TO DRAW", 10, 10, 2);',
        "System.drawRoundRect(8, 34, System.width() - 16, System.height() - 44, 8, Graphics.COLOR_CYAN);",
        "",
        "var hueColors = [Graphics.COLOR_YELLOW, Graphics.COLOR_CYAN, Graphics.COLOR_GREEN, Graphics.COLOR_MAGENTA];",
        "var ci = 0;",
        "var tick = 0;",
        "",
        "while (System.isRunning()) {",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 5, hueColors[ci % hueColors.length]);",
        "        if (tick % 10 === 0) ci++;",
        "    }",
        "    tick++;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      fs_crypto: [
        "System.fillScreen(0x0000);",
        "System.setTextColor(Graphics.COLOR_GREEN);",
        'System.drawString("FS + CRYPTO TEST", 10, 14, 2);',
        "",
        'FS.mkdir("/local/notes");',
        'FS.writeFile("/local/notes/info.txt", "KryonOS WASM OK");',
        'var txt = FS.readFile("/local/notes/info.txt");',
        "var hash = Crypto.sha256(txt);",
        "",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("READ: " + txt, 10, 50, 1);',
        'System.drawString("SHA256:", 10, 72, 1);',
        "System.setTextColor(Graphics.COLOR_CYAN);",
        "System.drawString(hash.slice(0, 32), 10, 88, 1);",
        "System.drawString(hash.slice(32), 10, 102, 1);",
        "",
        'System.print("File:", txt);',
        'System.print("SHA256:", hash);',
        'System.print("FastMath.sin(PI/2):", FastMath.sin(FastMath.HALF_PI));',
        'System.notify("Hash computed!", "info", 2200);'
      ].join("\n")
    };

    function setMobileTab(tabName) {
      workspace.setAttribute("data-mobile-tab", tabName);
      mobileTabs.forEach(function(btn) {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tabName);
      });
      if (tabName === "editor") {
        updateGutter();
      }
    }

    mobileTabs.forEach(function(btn) {
      btn.addEventListener("click", function() {
        setMobileTab(btn.getAttribute("data-tab"));
      });
    });

    function updateGutter() {
      const e = editor.value.split("\n").length;
      let t = "";
      for (let n = 1; n <= e; n++) t += n + (n < e ? "\n" : "");
      gutter.textContent = t;
      gutter.scrollTop = editor.scrollTop;
    }

    function appendConsole(e, t) {
      const n = document.createElement("div");
      n.className = "log-line" + (t ? " " + t : "");
      if (!t) {
        if (e.indexOf("JS ERROR") !== -1 || e.indexOf("[ERR]") !== -1) n.classList.add("err");
        else if (e.indexOf("[WARN]") !== -1) n.classList.add("warn");
        else if (e.indexOf("[NOTIFY") !== -1) n.classList.add("notify");
      }
      n.textContent = e;
      consoleOutput.appendChild(n);
      while (consoleOutput.children.length > 200) {
        consoleOutput.removeChild(consoleOutput.firstChild);
      }
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function runCurrentCode() {
      if (runBtn.disabled) return;
      window.__kryonQueue.push({ type: "run", code: editor.value });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    }

    editor.addEventListener("input", updateGutter);
    editor.addEventListener("scroll", function() {
      gutter.scrollTop = editor.scrollTop;
    });
    editor.addEventListener("keydown", function(e) {
      if ("Tab" === e.key) {
        e.preventDefault();
        const t = editor.selectionStart,
          n = editor.selectionEnd;
        editor.value = editor.value.substring(0, t) + "  " + editor.value.substring(n);
        editor.selectionStart = editor.selectionEnd = t + 2;
        updateGutter();
      } else if ((e.ctrlKey || e.metaKey) && "Enter" === e.key) {
        e.preventDefault();
        runCurrentCode();
      }
    });

    window.onKryonLog = function(e) {
      appendConsole(e);
    };

    window.onKryonStatus = function(e) {
      statusText.textContent = e;
      statusPill.classList.remove("ready", "error");
      if (e.indexOf("JS ERROR") !== -1 || e.indexOf("Cannot open") !== -1) {
        statusPill.classList.add("error");
      } else {
        statusPill.classList.add("ready");
      }
    };

    window.onKryonTouch = function(e, t, n) {
      touchBadge.textContent = "Touch: " + (e ? "DOWN" : "UP") + " (" + t + ", " + n + ")";
    };

    runBtn.addEventListener("click", runCurrentCode);

    stopBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "stop" });
    });

    reloadBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "reload" });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    });

    clearConsoleBtn.addEventListener("click", function() {
      consoleOutput.innerHTML = "";
    });

    presetButtons.forEach(function(e) {
      e.addEventListener("click", function() {
        presetButtons.forEach(function(btn) {
          btn.classList.remove("active");
        });
        e.classList.add("active");
        const t = parseInt(e.getAttribute("data-w"), 10),
          n = parseInt(e.getAttribute("data-h"), 10);
        window.__kryonQueue.push({ type: "resize", w: t, h: n });
      });
    });

    sampleSelect.addEventListener("change", function() {
      const e = sampleSelect.value;
      if ("hello" === e && window.Module && Module.FS) {
        try {
          editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" });
          updateGutter();
          runCurrentCode();
          return;
        } catch (err) {}
      }
      editor.value = BUILTIN_SAMPLES[e] || BUILTIN_SAMPLES.hello;
      updateGutter();
      runCurrentCode();
    });

    openBtn.addEventListener("click", function() {
      fileInput.click();
    });

    fileInput.addEventListener("change", function() {
      const e = fileInput.files[0];
      if (!e) return;
      const t = new FileReader();
      t.onload = function() {
        editor.value = t.result;
        updateGutter();
        runCurrentCode();
      };
      t.readAsText(e);
      fileInput.value = "";
    });

    downloadBtn.addEventListener("click", function() {
      const e = new Blob([editor.value], { type: "text/javascript;charset=utf-8" }),
        t = document.createElement("a");
      t.href = URL.createObjectURL(e);
      t.download = "main.js";
      t.click();
      URL.revokeObjectURL(t.href);
    });

    /* --- First-Time Guided Tour System --- */
    const TOUR_STORAGE_KEY = "kryonos_tour_done_v1";
    const tourBackdrop = document.getElementById("tourBackdrop"),
      tourSpotlight = document.getElementById("tourSpotlight"),
      tourTooltip = document.getElementById("tourTooltip"),
      tourStepBadge = document.getElementById("tourStepBadge"),
      tourTitle = document.getElementById("tourTitle"),
      tourDesc = document.getElementById("tourDesc"),
      tourDots = document.getElementById("tourDots"),
      tourSkipBtn = document.getElementById("tourSkipBtn"),
      tourPrevBtn = document.getElementById("tourPrevBtn"),
      tourNextBtn = document.getElementById("tourNextBtn"),
      tourCloseBtn = document.getElementById("tourCloseBtn");

    const TOUR_STEPS = [
      {
        target: "#sampleSelect",
        tab: null,
        title: "Samples & Local Scripts",
        desc: "Switch between built-in KryonOS examples like <code>3D Cube</code>, <code>2D Paint</code>, or <code>FS &amp; Crypto</code>, or open/save your own <code>.js</code> file."
      },
      {
        target: "#editorCard",
        tab: "editor",
        title: "Write KryonOS JavaScript",
        desc: "Edit <code>main.js</code> here using built-in APIs like <code>Kryon3D</code>, <code>System</code>, <code>Touch</code>, <code>FS</code>, and <code>Crypto</code>."
      },
      {
        target: "#runBtn",
        tab: null,
        title: "Run, Stop & Reload",
        desc: "Tap <strong>▶ Run</strong> (or press <code>Ctrl+Enter</code> on desktop) to compile and run your script inside the WASM simulator."
      },
      {
        target: "#deviceCard",
        tab: "simulator",
        title: "Interactive Virtual Device",
        desc: "Touch or drag directly on the screen to send <code>Touch.read()</code> coordinates, and switch resolutions for CYD, T-Deck, or Cardputer."
      },
      {
        target: "#consoleCard",
        tab: "simulator",
        title: "Live Console Output",
        desc: "Inspect <code>System.print()</code> logs, system notifications, and JavaScript runtime errors here in real time."
      }
    ];

    let tourActive = false;
    let tourIndex = 0;

    function isTourDone() {
      try {
        return localStorage.getItem(TOUR_STORAGE_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function markTourDone() {
      try {
        localStorage.setItem(TOUR_STORAGE_KEY, "1");
      } catch (e) {}
    }

    function renderTourDots() {
      tourDots.innerHTML = "";
      for (let i = 0; i < TOUR_STEPS.length; i++) {
        const dot = document.createElement("span");
        dot.className = "tour-dot" + (i === tourIndex ? " active" : "");
        tourDots.appendChild(dot);
      }
    }

    function positionTourElements() {
      if (!tourActive) return;
      const step = TOUR_STEPS[tourIndex];
      const target = document.querySelector(step.target);
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const pad = 5;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const spTop = Math.max(4, rect.top - pad);
      const spLeft = Math.max(4, rect.left - pad);
      const spWidth = Math.min(vw - spLeft - 4, rect.width + pad * 2);
      const spHeight = Math.min(vh - spTop - 4, rect.height + pad * 2);

      tourSpotlight.style.top = spTop + "px";
      tourSpotlight.style.left = spLeft + "px";
      tourSpotlight.style.width = Math.max(24, spWidth) + "px";
      tourSpotlight.style.height = Math.max(24, spHeight) + "px";

      const tipRect = tourTooltip.getBoundingClientRect();
      const tipW = tipRect.width || Math.min(340, vw - 24);
      const tipH = tipRect.height || 180;
      const gap = 12;

      let tipLeft = rect.left + rect.width / 2 - tipW / 2;
      tipLeft = Math.max(12, Math.min(vw - tipW - 12, tipLeft));

      let tipTop;
      const spaceBelow = vh - (spTop + spHeight) - gap;
      const spaceAbove = spTop - gap;

      if (spaceBelow >= tipH + 12) {
        tipTop = spTop + spHeight + gap;
      } else if (spaceAbove >= tipH + 12) {
        tipTop = spTop - tipH - gap;
      } else {
        // Fallback for large targets (e.g. Editor on mobile): pin neatly inside bottom or top
        tipTop = spTop > vh * 0.35 ? 12 : Math.max(12, vh - tipH - 12);
      }

      tourTooltip.style.left = tipLeft + "px";
      tourTooltip.style.top = tipTop + "px";
    }

    function showTourStep(idx) {
      tourIndex = Math.max(0, Math.min(TOUR_STEPS.length - 1, idx));
      const step = TOUR_STEPS[tourIndex];

      if (window.innerWidth <= 900 && step.tab) {
        setMobileTab(step.tab);
      }

      tourStepBadge.textContent = "Step " + (tourIndex + 1) + " of " + TOUR_STEPS.length;
      tourTitle.textContent = step.title;
      tourDesc.innerHTML = step.desc;
      tourPrevBtn.disabled = tourIndex === 0;
      tourNextBtn.textContent = tourIndex === TOUR_STEPS.length - 1 ? "Finish" : "Next";
      renderTourDots();

      const target = document.querySelector(step.target);
      if (target && window.innerWidth <= 900) {
        target.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      requestAnimationFrame(function() {
        positionTourElements();
        setTimeout(positionTourElements, 220);
      });
    }

    function startTour() {
      tourActive = true;
      tourBackdrop.classList.add("active");
      tourSpotlight.classList.add("active");
      tourTooltip.classList.add("active");
      showTourStep(0);
    }

    function endTour() {
      tourActive = false;
      tourBackdrop.classList.remove("active");
      tourSpotlight.classList.remove("active");
      tourTooltip.classList.remove("active");
      markTourDone();
    }

    tourBtn.addEventListener("click", startTour);
    tourSkipBtn.addEventListener("click", endTour);
    tourCloseBtn.addEventListener("click", endTour);
    tourPrevBtn.addEventListener("click", function() {
      if (tourIndex > 0) showTourStep(tourIndex - 1);
    });
    tourNextBtn.addEventListener("click", function() {
      if (tourIndex < TOUR_STEPS.length - 1) showTourStep(tourIndex + 1);
      else endTour();
    });

    window.addEventListener("resize", positionTourElements);
    rightCol.addEventListener("scroll", positionTourElements);
    window.addEventListener("keydown", function(e) {
      if (!tourActive) return;
      if (e.key === "Escape") endTour();
      else if (e.key === "ArrowRight") {
        if (tourIndex < TOUR_STEPS.length - 1) showTourStep(tourIndex + 1);
        else endTour();
      } else if (e.key === "ArrowLeft" && tourIndex > 0) {
        showTourStep(tourIndex - 1);
      }
    });

    var Module = {
      canvas: document.getElementById("canvas"),
      printErr: function(e) {
        appendConsole(e, "err");
      },
      onRuntimeInitialized: function() {
        runBtn.disabled = false;
        stopBtn.disabled = false;
        reloadBtn.disabled = false;
        window.onKryonStatus("Ready");
        try {
          Module.FS
            ? (editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" }))
            : (editor.value = BUILTIN_SAMPLES.hello);
        } catch (e) {
          editor.value = BUILTIN_SAMPLES.hello;
        }
        updateGutter();
      }
    };

    editor.value = BUILTIN_SAMPLES.hello;
    updateGutter();

    if (!isTourDone()) {
      setTimeout(startTour, 450);
    }
  </script>
  <script async src="KryonOS-Simulator.js"></script>
</body>
</html>
