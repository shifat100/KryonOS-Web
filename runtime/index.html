<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KryonOS Web Simulator</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warn: #d97706;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 14px rgba(15, 23, 42, 0.04);
      --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .topbar {
      min-height: 54px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-text {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
    }

    .status-pill.ready .status-dot {
      background: var(--success);
    }

    .status-pill.error {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .status-pill.error .status-dot {
      background: var(--danger);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      font-family: var(--sans);
      font-size: 13px;
      border-radius: 7px;
      outline: 0;
    }

    .select-input {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      max-width: 100%;
    }

    .btn {
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 50ms;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #94a3b8;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--danger-bg);
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    /* Mobile navigation tabs (hidden on desktop) */
    .mobile-tabs {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      gap: 8px;
      flex-shrink: 0;
    }

    .mobile-tab {
      flex: 1;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mobile-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      padding: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .card-header {
      min-height: 42px;
      padding: 6px 14px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--primary);
    }

    .hint-text {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      background: #fff;
    }

    .gutter {
      width: 46px;
      padding: 14px 8px 14px 0;
      background: var(--surface-alt);
      border-right: 1px solid var(--border);
      color: #94a3b8;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      text-align: right;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
      white-space: pre;
    }

    #codeEditor {
      flex: 1;
      min-width: 0;
      border: none;
      outline: 0;
      resize: none;
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      color: #0f172a;
      background: #fff;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .right-col {
      display: grid;
      grid-template-rows: 1.45fr 0.75fr;
      gap: 14px;
      min-height: 0;
    }

    .preset-group {
      display: inline-flex;
      background: var(--bg);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--border);
      gap: 2px;
      flex-wrap: wrap;
    }

    .preset-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .preset-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .device-stage {
      flex: 1;
      min-height: 0;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 8px;
    }

    .device-bezel {
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: calc(100% - 28px);
      min-height: 0;
      min-width: 0;
    }

    #canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      background: #000;
      outline: 0;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas:focus {
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    }

    .device-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .touch-badge {
      font-family: var(--mono);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 5px;
      color: var(--text);
      margin-left: auto;
    }

    .console-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      background: #fff;
    }

    .log-line {
      padding: 2px 0;
      border-bottom: 1px dashed #f1f5f9;
      word-break: break-word;
      color: #334155;
    }

    .log-line.err {
      color: var(--danger);
      font-weight: 500;
    }

    .log-line.warn {
      color: var(--warn);
    }

    .log-line.notify {
      color: var(--primary);
    }

    .btn-xs {
      height: 26px;
      padding: 0 10px;
      font-size: 11.5px;
    }

    /* Tablet & Android Phone Layout */
    @media (max-width: 900px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
        padding: 8px 12px;
        gap: 8px;
      }

      .brand {
        width: 100%;
      }

      .status-pill {
        margin-left: auto;
        max-width: 150px;
      }

      .toolbar-actions {
        width: 100%;
        gap: 6px;
      }

      .select-input {
        flex: 1 1 160px;
        height: 36px;
      }

      .btn {
        height: 36px;
        padding: 0 10px;
        font-size: 12.5px;
      }

      .mobile-tabs {
        display: flex;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      .editor-card,
      .right-col {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .workspace[data-mobile-tab="editor"] .editor-card {
        display: flex;
      }

      .workspace[data-mobile-tab="simulator"] .right-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .device-card {
        flex: 1.5 1 320px;
        min-height: 290px;
      }

      .console-card {
        flex: 1 1 160px;
        min-height: 150px;
      }
    }

    /* Compact Phone Adjustments */
    @media (max-width: 600px) {
      .brand-sub {
        display: none;
      }

      .hint-text {
        display: none;
      }

      .toolbar-actions .btn {
        flex: 1 1 auto;
      }

      #runBtn {
        flex: 1.4 1 auto;
      }

      .gutter {
        width: 38px;
        font-size: 14px;
        padding: 12px 6px 12px 0;
      }

      #codeEditor {
        font-size: 14px;
        padding: 12px;
      }

      .device-stage {
        padding: 8px;
        gap: 6px;
      }

      .device-bezel {
        padding: 6px;
        border-radius: 10px;
      }

      .preset-group {
        width: 100%;
      }

      .preset-btn {
        flex: 1;
        text-align: center;
        padding: 5px 4px;
        font-size: 11px;
      }

      .device-footer-hint {
        display: none;
      }

      .touch-badge {
        margin-left: 0;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">K</div>
        <div class="brand-text">
          <span class="brand-title">KryonOS Web Simulator</span>
          <span class="brand-sub">Duktape 2.7 + SDL2 WASM</span>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Loading WASM...</span>
        </div>
      </div>

      <div class="toolbar-actions">
        <select class="select-input" id="sampleSelect" title="Load Sample App">
          <option value="hello">Sample: 3D Cube + Touch</option>
          <option value="paint">Sample: 2D Paint &amp; Sprites</option>
          <option value="fs_crypto">Sample: FS &amp; Crypto</option>
        </select>
        <input accept=".js" hidden id="fileInput" type="file">
        <button class="btn" id="openBtn" title="Open local .js file">Open .js</button>
        <button class="btn" id="downloadBtn" title="Download current main.js">Save .js</button>
        <button class="btn" id="reloadBtn" title="Restart current app" disabled>Reload</button>
        <button class="btn btn-danger" id="stopBtn" title="Stop running loop" disabled>Stop</button>
        <button class="btn btn-primary" id="runBtn" title="Ctrl + Enter" disabled>▶ Run</button>
      </div>
    </header>

    <nav class="mobile-tabs" aria-label="Workspace View">
      <button class="mobile-tab active" data-tab="simulator" type="button">Simulator</button>
      <button class="mobile-tab" data-tab="editor" type="button">Code Editor</button>
    </nav>

    <main class="workspace" id="workspace" data-mobile-tab="simulator">
      <section class="card editor-card">
        <div class="card-header">
          <div class="card-title">
            <span>Editor</span>
            <span class="file-tab">main.js</span>
          </div>
          <span class="hint-text">Ctrl+Enter: Run &nbsp;|&nbsp; Tab: Indent</span>
        </div>
        <div class="editor-wrap">
          <div class="gutter" id="gutter">1</div>
          <textarea
            id="codeEditor"
            placeholder="// Write KryonOS JavaScript here..."
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
          ></textarea>
        </div>
      </section>

      <div class="right-col">
        <section class="card device-card">
          <div class="card-header">
            <div class="card-title">Virtual Device</div>
            <div class="preset-group">
              <button class="preset-btn active" data-h="320" data-w="240" type="button">240×320 CYD</button>
              <button class="preset-btn" data-h="240" data-w="320" type="button">320×240 T-Deck</button>
              <button class="preset-btn" data-h="135" data-w="240" type="button">240×135 Cardputer</button>
            </div>
          </div>
          <div class="device-stage">
            <div class="device-bezel">
              <canvas height="440" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" width="560"></canvas>
            </div>
            <div class="device-footer">
              <span class="device-footer-hint">Mouse = Touch • Click screen to send Keyboard / Arrow keys</span>
              <span class="touch-badge" id="touchBadge">Touch: UP (0, 0)</span>
            </div>
          </div>
        </section>

        <section class="card console-card">
          <div class="card-header">
            <div class="card-title">Console Output</div>
            <button class="btn btn-xs" id="clearConsoleBtn" type="button">Clear</button>
          </div>
          <div class="console-body" id="consoleOutput"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    window.__kryonQueue = [];

    const editor = document.getElementById("codeEditor"),
      gutter = document.getElementById("gutter"),
      runBtn = document.getElementById("runBtn"),
      stopBtn = document.getElementById("stopBtn"),
      reloadBtn = document.getElementById("reloadBtn"),
      openBtn = document.getElementById("openBtn"),
      downloadBtn = document.getElementById("downloadBtn"),
      fileInput = document.getElementById("fileInput"),
      sampleSelect = document.getElementById("sampleSelect"),
      clearConsoleBtn = document.getElementById("clearConsoleBtn"),
      consoleOutput = document.getElementById("consoleOutput"),
      statusPill = document.getElementById("statusPill"),
      statusText = document.getElementById("statusText"),
      touchBadge = document.getElementById("touchBadge"),
      presetButtons = document.querySelectorAll(".preset-btn"),
      workspace = document.getElementById("workspace"),
      mobileTabs = document.querySelectorAll(".mobile-tab");

    const BUILTIN_SAMPLES = {
      hello: [
        "var angle = 0;",
        "",
        'FS.writeFile("/local/test.txt", "Hello KryonOS Web!");',
        'System.print("FS:", FS.readFile("/local/test.txt"));',
        'System.notify("Web Simulator Ready", "success", 2500);',
        "",
        "while (System.isRunning()) {",
        "    Kryon3D.begin();",
        "    Kryon3D.clear(0x000F);",
        "    Kryon3D.setCamera(0, 0, -4.5, 0, 0, 0, 60);",
        "    Kryon3D.drawCube(0, 0, 0, 1.5, angle * 0.7, angle, 0.2, Graphics.COLOR_CYAN);",
        "",
        "    System.setTextColor(Graphics.COLOR_WHITE);",
        '    System.drawString("KRYONOS WEB", 12, 12, 2);',
        "",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 7, Graphics.COLOR_YELLOW);",
        "    }",
        "",
        "    Kryon3D.end();",
        "    angle += 0.05;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      paint: [
        "System.fillScreen(0x1084);",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("TOUCH TO DRAW", 10, 10, 2);',
        "System.drawRoundRect(8, 34, System.width() - 16, System.height() - 44, 8, Graphics.COLOR_CYAN);",
        "",
        "var hueColors = [Graphics.COLOR_YELLOW, Graphics.COLOR_CYAN, Graphics.COLOR_GREEN, Graphics.COLOR_MAGENTA];",
        "var ci = 0;",
        "var tick = 0;",
        "",
        "while (System.isRunning()) {",
        "    var t = Touch.read();",
        "    if (t.touched) {",
        "        System.fillCircle(t.x, t.y, 5, hueColors[ci % hueColors.length]);",
        "        if (tick % 10 === 0) ci++;",
        "    }",
        "    tick++;",
        "    System.delay(16);",
        "}"
      ].join("\n"),
      fs_crypto: [
        "System.fillScreen(0x0000);",
        "System.setTextColor(Graphics.COLOR_GREEN);",
        'System.drawString("FS + CRYPTO TEST", 10, 14, 2);',
        "",
        'FS.mkdir("/local/notes");',
        'FS.writeFile("/local/notes/info.txt", "KryonOS WASM OK");',
        'var txt = FS.readFile("/local/notes/info.txt");',
        "var hash = Crypto.sha256(txt);",
        "",
        "System.setTextColor(Graphics.COLOR_WHITE);",
        'System.drawString("READ: " + txt, 10, 50, 1);',
        'System.drawString("SHA256:", 10, 72, 1);',
        "System.setTextColor(Graphics.COLOR_CYAN);",
        "System.drawString(hash.slice(0, 32), 10, 88, 1);",
        "System.drawString(hash.slice(32), 10, 102, 1);",
        "",
        'System.print("File:", txt);',
        'System.print("SHA256:", hash);',
        'System.print("FastMath.sin(PI/2):", FastMath.sin(FastMath.HALF_PI));',
        'System.notify("Hash computed!", "info", 2200);'
      ].join("\n")
    };

    function setMobileTab(tabName) {
      workspace.setAttribute("data-mobile-tab", tabName);
      mobileTabs.forEach(function(btn) {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tabName);
      });
      if (tabName === "editor") {
        updateGutter();
      }
    }

    mobileTabs.forEach(function(btn) {
      btn.addEventListener("click", function() {
        setMobileTab(btn.getAttribute("data-tab"));
      });
    });

    function updateGutter() {
      const e = editor.value.split("\n").length;
      let t = "";
      for (let n = 1; n <= e; n++) t += n + (n < e ? "\n" : "");
      gutter.textContent = t;
      gutter.scrollTop = editor.scrollTop;
    }

    function appendConsole(e, t) {
      const n = document.createElement("div");
      n.className = "log-line" + (t ? " " + t : "");
      if (!t) {
        if (e.indexOf("JS ERROR") !== -1 || e.indexOf("[ERR]") !== -1) n.classList.add("err");
        else if (e.indexOf("[WARN]") !== -1) n.classList.add("warn");
        else if (e.indexOf("[NOTIFY") !== -1) n.classList.add("notify");
      }
      n.textContent = e;
      consoleOutput.appendChild(n);
      while (consoleOutput.children.length > 200) {
        consoleOutput.removeChild(consoleOutput.firstChild);
      }
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function runCurrentCode() {
      if (runBtn.disabled) return;
      window.__kryonQueue.push({ type: "run", code: editor.value });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    }

    editor.addEventListener("input", updateGutter);
    editor.addEventListener("scroll", function() {
      gutter.scrollTop = editor.scrollTop;
    });
    editor.addEventListener("keydown", function(e) {
      if ("Tab" === e.key) {
        e.preventDefault();
        const t = editor.selectionStart,
          n = editor.selectionEnd;
        editor.value = editor.value.substring(0, t) + "  " + editor.value.substring(n);
        editor.selectionStart = editor.selectionEnd = t + 2;
        updateGutter();
      } else if ((e.ctrlKey || e.metaKey) && "Enter" === e.key) {
        e.preventDefault();
        runCurrentCode();
      }
    });

    window.onKryonLog = function(e) {
      appendConsole(e);
    };

    window.onKryonStatus = function(e) {
      statusText.textContent = e;
      statusPill.classList.remove("ready", "error");
      if (e.indexOf("JS ERROR") !== -1 || e.indexOf("Cannot open") !== -1) {
        statusPill.classList.add("error");
      } else {
        statusPill.classList.add("ready");
      }
    };

    window.onKryonTouch = function(e, t, n) {
      touchBadge.textContent = "Touch: " + (e ? "DOWN" : "UP") + " (" + t + ", " + n + ")";
    };

    runBtn.addEventListener("click", runCurrentCode);

    stopBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "stop" });
    });

    reloadBtn.addEventListener("click", function() {
      window.__kryonQueue.push({ type: "reload" });
      if (window.innerWidth <= 900) {
        setMobileTab("simulator");
      }
    });

    clearConsoleBtn.addEventListener("click", function() {
      consoleOutput.innerHTML = "";
    });

    presetButtons.forEach(function(e) {
      e.addEventListener("click", function() {
        presetButtons.forEach(function(btn) {
          btn.classList.remove("active");
        });
        e.classList.add("active");
        const t = parseInt(e.getAttribute("data-w"), 10),
          n = parseInt(e.getAttribute("data-h"), 10);
        window.__kryonQueue.push({ type: "resize", w: t, h: n });
      });
    });

    sampleSelect.addEventListener("change", function() {
      const e = sampleSelect.value;
      if ("hello" === e && window.Module && Module.FS) {
        try {
          editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" });
          updateGutter();
          runCurrentCode();
          return;
        } catch (err) {}
      }
      editor.value = BUILTIN_SAMPLES[e] || BUILTIN_SAMPLES.hello;
      updateGutter();
      runCurrentCode();
    });

    openBtn.addEventListener("click", function() {
      fileInput.click();
    });

    fileInput.addEventListener("change", function() {
      const e = fileInput.files[0];
      if (!e) return;
      const t = new FileReader();
      t.onload = function() {
        editor.value = t.result;
        updateGutter();
        runCurrentCode();
      };
      t.readAsText(e);
      fileInput.value = "";
    });

    downloadBtn.addEventListener("click", function() {
      const e = new Blob([editor.value], { type: "text/javascript;charset=utf-8" }),
        t = document.createElement("a");
      t.href = URL.createObjectURL(e);
      t.download = "main.js";
      t.click();
      URL.revokeObjectURL(t.href);
    });

    var Module = {
      canvas: document.getElementById("canvas"),
      printErr: function(e) {
        appendConsole(e, "err");
      },
      onRuntimeInitialized: function() {
        runBtn.disabled = false;
        stopBtn.disabled = false;
        reloadBtn.disabled = false;
        window.onKryonStatus("Ready");
        try {
          Module.FS
            ? (editor.value = Module.FS.readFile("/samples/hello_world/main.js", { encoding: "utf8" }))
            : (editor.value = BUILTIN_SAMPLES.hello);
        } catch (e) {
          editor.value = BUILTIN_SAMPLES.hello;
        }
        updateGutter();
      }
    };

    editor.value = BUILTIN_SAMPLES.hello;
    updateGutter();
  </script>
  <script async src="KryonOS-Simulator.js"></script>
</body>
</html>
