<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KryonOS - Web Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0b0b14;--panel:#161625;--panel2:#1e1e30;--border:#2c2c46;--text:#d0d0e0;--dim:#7a7a95;--accent:#00d47a;--accent2:#00b4ff;--warn:#fbbf24;--err:#f43f5e;--ok:#10b981}
body{background:radial-gradient(ellipse at top,#181828 0%,#080810 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px;gap:20px;flex-wrap:wrap}
.device-wrapper{display:flex;flex-direction:column;align-items:center}
.device{background:linear-gradient(145deg,#2a2a42,#141422);border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid #3a3a56}
.bezel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;min-height:24px}
.bezel-left{display:flex;align-items:center;gap:6px}
.hw-cam{background:linear-gradient(180deg,#3a3a56,#25253b);color:#b0b0c8;border:none;width:24px;height:22px;border-radius:5px;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #131324;display:inline-flex;align-items:center;justify-content:center}
.hw-led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);display:inline-block}
.hw-label{font-size:9px;color:#666;font-weight:700;letter-spacing:1px}
.hw-exit{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;border:none;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #7f1d1d;display:none}
.hw-exit.active{display:inline-block}
.screen-frame{position:relative;background:#000;border-radius:6px;padding:5px;box-shadow:inset 0 0 25px rgba(0,0,0,.95),0 0 0 1px #38385a;line-height:0}
#screen{display:block;image-rendering:pixelated;background:#000;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
#overlay{position:absolute;left:5px;top:5px;image-rendering:pixelated;pointer-events:none}
.brand{text-align:center;color:#6a6a85;font-size:10px;letter-spacing:2.5px;margin-top:10px;font-weight:700}
.brand span{color:var(--accent2)}
.controls{display:flex;justify-content:space-between;margin-top:12px;gap:8px;width:100%}
.ctrl-btn{flex:1;background:linear-gradient(180deg,#3a3a56,#25253b);color:#b0b0c8;border:none;padding:9px 4px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #131324;transition:all .1s}
.ctrl-btn:active{transform:translateY(2px);box-shadow:0 0 0 #131324}
.panel{background:linear-gradient(145deg,#222236,#151524);border-radius:16px;padding:16px;width:600px;max-width:100%;border:1px solid #35354e;box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;padding:10px 12px;background:#0d0d18;border:1px solid var(--border);border-radius:8px}
.status-bar .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.status-bar .st-label{color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.status-bar .st-val{color:var(--accent);font-weight:700;font-family:'Menlo',monospace;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.row select,.row input{background:#0a0a14;color:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Menlo',monospace;outline:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:transparent;border:none;color:var(--dim);padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none;flex-direction:column;gap:10px}
.tab-pane.active{display:flex}
.panel-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
textarea.code-editor{width:100%;height:280px;background:#07070f;color:#7ee787;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Menlo',monospace;font-size:12px;line-height:1.5;resize:vertical;outline:none;white-space:pre;overflow:auto}
.btn{background:linear-gradient(180deg,var(--accent),#00a35e);color:#000;border:none;padding:8px 14px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #006b3d}
.btn.sec{background:linear-gradient(180deg,#3a3a56,#25253b);color:#ccc;box-shadow:0 2px 0 #131324}
.btn.danger{background:linear-gradient(180deg,#f43f5e,#be123c);color:#fff;box-shadow:0 2px 0 #881337}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 0 #1e3a8a}
#console{background:#05050c;color:#6ee7b7;font-family:'Menlo',monospace;font-size:11px;padding:10px;border-radius:8px;height:200px;overflow-y:auto;border:1px solid var(--border);line-height:1.5}
.app-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;font-size:11px}
.app-row strong{color:var(--accent2)}.app-row .actions{display:flex;gap:6px}
</style>
</head>
<body>
<div class="device-wrapper">
  <div class="device">
    <div class="bezel-top">
      <div class="bezel-left">
        <button class="hw-cam" id="hw-cam-btn" title="Screenshot">📷</button>
        <span class="hw-led" id="led"></span>
        <span class="hw-label">KRYON·CORE</span>
      </div>
      <button class="hw-exit" id="hw-exit-btn">✕ EXIT APP</button>
    </div>
    <div class="screen-frame">
      <canvas id="screen" width="240" height="320"></canvas>
      <canvas id="overlay" width="240" height="320"></canvas>
    </div>
    <div class="brand">ESP32 · KRYONOS <span id="board-label">DevKitC-1</span></div>
    <div class="controls">
      <button class="ctrl-btn" data-key="up">▲ UP</button>
      <button class="ctrl-btn" data-key="sel">● SEL</button>
      <button class="ctrl-btn" data-key="dn">▼ DN</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="status-bar">
    <div class="st"><span class="st-label">State</span><span class="st-val" id="st-state">LAUNCHER</span></div>
    <div class="st"><span class="st-label">WiFi</span><span class="st-val" id="st-wifi">ONLINE</span></div>
    <div class="st"><span class="st-label">Free Heap</span><span class="st-val" id="st-heap">384 KB</span></div>
    <div class="st"><span class="st-label">FPS</span><span class="st-val" id="st-fps">60</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="apps">Apps</button>
    <button class="tab" data-tab="studio">Studio</button>
    <button class="tab" data-tab="sim">Simulator</button>
    <button class="tab" data-tab="console">Console</button>
  </div>
  <div class="tab-pane active" data-pane="apps">
    <div class="panel-label">Installed Applications</div>
    <div id="app-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
    <div class="row">
      <button class="btn blue" id="btn-refresh-apps">↻ Refresh</button>
      <button class="btn sec" id="btn-seed-demo">+ Install Demo Apps</button>
    </div>
  </div>
  <div class="tab-pane" data-pane="studio">
    <div class="row">
      <label>Name</label><input type="text" id="app-name" placeholder="Crypto Test" style="flex:1">
      <label>Package</label><input type="text" id="app-pkg" placeholder="com.kryonos.cryptotest" style="flex:1">
    </div>
    <div class="row">
      <label>Version</label><input type="text" id="app-ver" value="1.0.0" style="width:70px">
      <label>Author</label><input type="text" id="app-author" value="KryonDev" style="flex:1">
      <label>Category</label>
      <select id="app-cat" style="width:110px">
        <option value="Utility">Utility</option>
        <option value="Security">Security</option>
        <option value="Game">Game</option>
        <option value="Education">Education</option>
      </select>
    </div>
    <div class="row" style="background:#0d0d18;padding:6px 10px;border-radius:6px;border:1px solid var(--border)">
      <label style="margin-right:8px">Permissions:</label>
      <label style="cursor:pointer;margin-right:12px"><input type="checkbox" id="perm-storage" checked> Storage</label>
      <label style="cursor:pointer;margin-right:12px"><input type="checkbox" id="perm-network" checked> Network</label>
      <label style="cursor:pointer;margin-right:12px"><input type="checkbox" id="perm-gpio"> GPIO</label>
      <label style="cursor:pointer;margin-right:12px"><input type="checkbox" id="perm-i2c"> I2C</label>
      <label style="cursor:pointer"><input type="checkbox" id="perm-ai"> AI</label>
    </div>
    <textarea class="code-editor" id="app-code" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" id="btn-install">💾 Install</button>
      <button class="btn blue" id="btn-run-live">▶ Run Live</button>
      <button class="btn sec" id="btn-format">⟲ Format Flash</button>
    </div>
  </div>
  <div class="tab-pane" data-pane="sim">
    <div class="row">
      <label>Board</label>
      <select id="board-select">
        <option value="esp32-s3-devkitc-1-n16r8">ESP32-S3 DevKitC-1 (240×320)</option>
        <option value="m5stack-cardputer">M5Stack Cardputer (240×135)</option>
        <option value="lilygo-t-hmi">LilyGO T-HMI (240×320)</option>
        <option value="esp32-cyd-28">ESP32-CYD-28 (240×320)</option>
        <option value="esp32doit-devkit-v1">ESP32 DevKit v1 (240×320)</option>
      </select>
    </div>
    <div class="row">
      <label>Time</label><input type="text" id="sim-time" value="UTC0" style="width:100px">
      <label><input type="checkbox" id="sim-24h" checked> 24h</label>
      <label><input type="checkbox" id="sim-wifi" checked> WiFi</label>
    </div>
    <div class="panel-label">Controls</div>
    <div class="row">
      <button class="btn sec" id="btn-reboot">⟳ Reboot</button>
      <button class="btn sec" id="btn-launcher">⌂ Launcher</button>
      <button class="btn sec" id="btn-shot">📷 Screenshot</button>
    </div>
  </div>
  <div class="tab-pane" data-pane="console">
    <div id="console"></div>
    <div class="row"><button class="btn sec" id="btn-clear-log">Clear</button></div>
  </div>
</div>
<script src="emulator.js"></script>
</body>
</html>
